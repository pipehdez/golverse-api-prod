services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
      args:
        - GIT_REPO_URL=${GIT_REPO_URL}
        - GIT_BRANCH=${GIT_BRANCH:-main}
      secrets:
        - github_token
    container_name: fafi_api_prod
    restart: unless-stopped
    command: gunicorn fafi.wsgi:application --bind 0.0.0.0:8000 --workers 5
    ports:
      # Bound to loopback only: ufw doesn't filter Docker-published ports (Docker's own
      # iptables rules bypass it), so binding 0.0.0.0 here would expose this to the internet
      # regardless of the firewall. The reverse proxy (once set up) reaches this over the
      # internal Docker network, not via the host port; use `ssh -L 8000:localhost:8000` for
      # ad hoc access.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.prod
    environment:
      - RUN_MIGRATIONS=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # SECURE_SSL_REDIRECT is on, so without X-Forwarded-Proto Django 301s this to https,
      # which has nothing listening inside the container (TLS is terminated by the reverse
      # proxy, not gunicorn). Send the same header the proxy sends for real traffic.
      # Use 127.0.0.1, not localhost: gunicorn binds 0.0.0.0 (IPv4-only), but localhost
      # resolves to ::1 first in this image, which nothing listens on.
      test: [ "CMD", "wget", "-qO-", "--header=X-Forwarded-Proto: https", "http://127.0.0.1:8000/health/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - fafi_network_prod

  postgres:
    image: postgres:15-alpine
    container_name: fafi_postgres_prod
    restart: unless-stopped
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data/
    env_file:
      - .env.prod
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fafi_network_prod

  redis:
    image: redis:7-alpine
    container_name: fafi_redis_prod
    restart: unless-stopped
    volumes:
      - redis_data_prod:/data
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    env_file:
      - .env.prod
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fafi_network_prod

  minio:
    image: minio/minio
    container_name: fafi_minio_prod
    restart: unless-stopped
    ports:
      # Loopback only — see the note on the api service's ports. The S3 API (9000) is reached
      # internally by the api/celery containers via the Docker network; only the console (9001)
      # needs ad hoc access, via `ssh -L 9001:localhost:9001`.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data_prod:/data
    env_file:
      - .env.prod
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - fafi_network_prod

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
      args:
        - GIT_REPO_URL=${GIT_REPO_URL}
        - GIT_BRANCH=${GIT_BRANCH:-main}
      secrets:
        - github_token
    container_name: fafi_celery_worker_prod
    restart: unless-stopped
    command: celery -A fafi worker -l info
    env_file:
      - .env.prod
    depends_on:
      - api
      - redis
    networks:
      - fafi_network_prod

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
      args:
        - GIT_REPO_URL=${GIT_REPO_URL}
        - GIT_BRANCH=${GIT_BRANCH:-main}
      secrets:
        - github_token
    container_name: fafi_celery_beat_prod
    restart: unless-stopped
    command: celery -A fafi beat -l info
    env_file:
      - .env.prod
    depends_on:
      - api
      - redis
    networks:
      - fafi_network_prod

networks:
  fafi_network_prod:
    driver: bridge

volumes:
  postgres_data_prod:
  redis_data_prod:
  minio_data_prod:

secrets:
  github_token:
    environment: GITHUB_TOKEN
